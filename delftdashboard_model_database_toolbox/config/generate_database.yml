element:
- style: listbox
  position:
    x: 10
    y: 10
    width: 150
    height: 110
  text: Available Collections
  text_position: above
  method: select_collection
  module: delftdashboard_model_database_toolbox.generate_database
  variable: active_available_collection_name
  tooltip: Select an available collection
  variable_group: model_database
  select: item
  option_string:
    variable: available_collection_names
    variable_group: model_database
  option_value:
    variable: available_collection_names
    variable_group: model_database
- style: listbox
  position:
    x: 230
    y: 10
    width: 150
    height: 110
  text: Selected Collections
  text_position: above
  method: select_selected_collections
  module: delftdashboard_model_database_toolbox.generate_database
  variable: active_selected_collection_name
  tooltip: Select a shown collection
  variable_group: model_database
  select: item
  option_string:
    variable: selected_collection_names
    variable_group: model_database
  option_value:
    variable: selected_collection_names
    variable_group: model_database
- style: listbox
  position:
    x: 490
    y: 10
    width: 150
    height: 110
  text: Available Domains
  text_position: above
  method: select_domain_from_list
  variable: active_domain_name
  tooltip: Select a domain from the list
  variable_group: model_database
  select: item
  option_string:
    variable: domain_names
    variable_group: model_database
  option_value:
    variable: domain_names
    variable_group: model_database
- style: pushbutton
  position:
    x: 170
    y: 100
    width: 50
    height: 20
  text: Show ->
  method: use_collection
  module: delftdashboard_model_database_toolbox.generate_database
  tooltip: Add the selected collection to the shown list
  text_position: left
- style: pushbutton
  position:
    x: 170
    y: 70
    width: 50
    height: 20
  method: remove_collection
  text: <- Hide
  module: delftdashboard_model_database_toolbox.generate_database
  tooltip: Remove the selected collection from the shown list
  text_position: left
- style: checkbox
  position:
    x: 390
    y: 30
    width: 120
    height: 20
  text: SFINCS
  variable: show_sfincs
  variable_group: model_database
  method: toggle_sfincs
  tooltip: Show or hide SFINCS domains on the map
  module: delftdashboard_model_database_toolbox.generate_database
- style: checkbox
  position:
    x: 390
    y: 10
    width: 120
    height: 20
  text: HurryWave
  variable: show_hurrywave
  variable_group: model_database
  method: toggle_hurrywave
  tooltip: Show or hide HurryWave domains on the map
  module: delftdashboard_model_database_toolbox.generate_database
- style: pushbutton
  position:
    x: 650
    y: 100
    width: 100
    height: 20
  method: activate_domain
  text: Load Domain
  module: delftdashboard_model_database_toolbox.generate_database
  tooltip: Load the selected domain into the application
