[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "delftdashboard-model-database-toolbox"
description = "Delft Dashboard toolbox for managing collections of pre-built model domains"
readme = "README.md"
authors = [
    { name = "Maarten van Ormondt", email = "maarten.vanormondt@deltares.nl"},
]
license = { text = "MIT" }
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "geopandas",
    "pandas",
    "shapely",
    "toml",
    "rasterio",
    "affine",
]
dynamic = ["version"]

[project.optional-dependencies]
tests = ["pytest", "pytest-cov"]

[project.entry-points."delftdashboard.toolboxes"]
model_database = "delftdashboard_model_database_toolbox"

[tool.setuptools]
zip-safe = true

[tool.setuptools.dynamic]
version = { attr = "delftdashboard_model_database_toolbox.__version__" }

[tool.setuptools.packages.find]
include = ["delftdashboard_model_database_toolbox*"]

[tool.setuptools.package-data]
"*" = ["*.yml"]
